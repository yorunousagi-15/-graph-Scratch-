<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MathLab V7</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/mathjs@14.0.1/lib/browser/math.js"></script><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script></head><body><header><div><h1>MathLab <span>V6</span></h1><p>実関数・特殊関数・複素解析をひとつに</p></div><button id="theme">🌙</button></header><div class="app"><aside><label>表示モード</label><select id="mode"><option value="real">実関数</option><option value="special">特殊関数</option><option value="complex">複素平面</option><option value="critical">ゼータ臨界線</option><option value="contour">複素積分・留数</option><option value="polar">極座標</option><option value="param">媒介変数</option></select><div id="real" class="pane"><label>関数</label><div id="fns"></div><button class="secondary" id="add">＋ 関数追加</button><div class="row"><div><label>最小 x</label><input id="xmin" value="-10"></div><div><label>最大 x</label><input id="xmax" value="10"></div></div><label>サンプル数</label><input id="samples" value="1800" type="number"><div class="grid"><button id="deriv">微分</button><button id="roots">零点</button><button id="integral">定積分</button><button id="absint">∫|f|</button></div><p id="analysis">解析結果</p></div><div id="special" class="pane hidden"><label>特殊関数</label><select id="sf"><option value="gamma">Γ(x) Gamma</option><option value="zeta">ζ(x) Zeta</option><option value="digamma">ψ(x) Digamma</option><option value="polygamma">ψ₁(x) Polygamma</option><option value="erf">erf(x)</option><option value="besselJ">J₀(x) Bessel</option><option value="sinc">sinc(x)</option><option value="loggamma">log Γ(x)</option></select><label>x範囲</label><div class="row"><input id="smin" value="-5"><input id="smax" value="10"></div><button id="spPlot">▶ 特殊関数を描画</button></div><div id="complex" class="pane hidden"><label>f(z)</label><input id="cf" value="gamma"><div class="quick"><button data-f="zeta">ζ(z)</button><button data-f="gamma">Γ(z)</button><button data-f="1/z">1/z</button><button data-f="exp(z)">e^z</button></div><label>Re(z)</label><div class="row"><input id="cxa" value="-3"><input id="cxb" value="3"></div><label>Im(z)</label><div class="row"><input id="cya" value="-3"><input id="cyb" value="3"></div><select id="cview"><option value="abs">log(1+|f|)</option><option value="phase">arg f</option><option value="re">Re f</option><option value="im">Im f</option></select></div><div id="critical" class="pane hidden"><label>ζ(s), s=1/2+it</label><div class="row"><input id="tmin" value="0"><input id="tmax" value="50"></div><label>サンプル数</label><input id="tn" value="800" type="number"><button id="critPlot">▶ 描画</button></div><div id="contour" class="pane hidden"><label>f(z)</label><input id="qf" value="1/(z-1)"><div class="quick"><button data-q="1/(z-1)">1/(z-1)</button><button data-q="1/(z^2+1)">1/(z²+1)</button><button data-q="exp(z)/z">e^z/z</button></div><label>矩形領域</label><div class="row"><input id="x1" value="-2"><input id="x2" value="2"></div><div class="row"><input id="y1" value="-2"><input id="y2" value="2"></div><div class="grid"><button id="ci">∮ f(z)dz</button><button id="res">留数総和</button></div><p id="cres">結果</p></div><div id="polar" class="pane hidden"><label>r(θ)</label><input id="rf" value="sin(3*theta)"><div class="row"><input id="pa" value="0"><input id="pb" value="2*pi"></div></div><div id="param" class="pane hidden"><label>x(t)</label><input id="px" value="cos(t)"><label>y(t)</label><input id="py" value="sin(t)"><div class="row"><input id="ta" value="0"><input id="tb" value="2*pi"></div></div><button id="draw" class="primary">▶ 描画</button></aside><section class="canvas"><div id="plot"></div></section></div><footer>MathLab V7</footer><script src="script.js"></script></body></html>
